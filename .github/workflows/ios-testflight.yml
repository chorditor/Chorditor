# iOS 서명 빌드 → TestFlight 업로드 (App Store Connect API 키 사용)
#  - 공개 레포이므로 docs/ios-build.md §5-4 조건을 지킨다:
#      · 트리거는 수동(workflow_dispatch)과 태그 푸시(ios-tf-*)뿐. PR·일반 push 트리거 없음
#      · 서명된 .ipa 를 아티팩트로 남기지 않는다(곧바로 TestFlight 로 업로드)
#      · 비밀(Secrets)은 환경변수로만 쓰고 로그에 출력하지 않는다
#  - 필요한 Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, GOOGLE_SERVICE_INFO_PLIST
#  - 실행: 태그 푸시(git tag ios-tf-N && git push origin ios-tf-N) 또는 gh workflow run
name: iOS TestFlight (signed)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'CFBundleShortVersionString (예: 1.4.0)'
        required: false
        default: '1.4.0'
  push:
    tags:
      - 'ios-tf-*'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  TEAM_ID: D2AN2P8CL2
  BUNDLE_ID: com.chorditor.app

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          missing=0
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 GOOGLE_SERVICE_INFO_PLIST; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n 이(가) 비어 있음"; missing=1; fi
          done
          exit $missing

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      # package-lock.json 이 core 8 ↔ google-auth(core 6) peer 불일치를 이미 포함 → legacy-peer-deps
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # GoogleService-Info.plist 는 .gitignore 라 레포에 없다 → Secret 으로 복원해 앱 번들(Resources)에 넣는다
      - name: Add GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          gem list -i xcodeproj > /dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby -rxcodeproj -e '
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" }
            group = proj.main_group["App"]
            ref = group.new_file("GoogleService-Info.plist")
            target.resources_build_phase.add_file_reference(ref)
            proj.save
          '

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.4.0' }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Cleanup keys
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          rm -f ios/App/App/GoogleService-Info.plist
