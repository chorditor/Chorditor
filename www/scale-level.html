<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 언어 결정·화면 번역: 다른 스크립트·본문보다 먼저 -->
  <script src="i18n.js"></script>
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 스케일 훈련</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="training-flow-page">

  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 탑바: 뒤로가기 + 피크바 (style-guide.md §11 cd-topbar) ── -->
    <header class="cd-topbar cd-topbar--white">
      <button id="back-btn" class="icon-btn" onpointerup="closeScaleLevel()">
        <i data-lucide="chevron-left"></i>
      </button>
      <span class="top-bar-title"></span>
      <div class="topbar-currency" id="topbar-currency" style="margin-left:auto;">
        <div class="currency-item currency-item--clickable" onclick="openPeakboxModal()">
          <span class="currency-count" id="currency-peakbox-count">0</span>
          <div class="currency-icon-box"><img src="image/gift.png" alt=""></div>
        </div>
        <div class="currency-item currency-item--clickable" onclick="openPeakTimerPopup(event)">
          <span class="currency-count" id="currency-peak-count">30/30</span>
          <div class="currency-icon-box"><img src="image/peak.svg" alt=""></div>
        </div>
      </div>
    </header>

    <!-- ── 메인 (style-guide.md §11 cd-main) ── -->
    <main class="cd-main cd-main--white scale-level-main">

      <!-- 헤드: 타이틀 + 셀렉터(KEY 라벨·#/b·핑거토글·12key 스트립) -->
      <header class="cd-head">

        <div class="cd-title" id="form-label"></div>

        <div class="cd-selector">

          <div class="key-selector-top-row">
            <span class="key-selector-label">KEY</span>
            <div class="accidental-toggle-row">
              <div class="accidental-toggle" id="accidental-toggle">
                <span class="acc-btn active" id="toggle-sharp">#</span>
                <span class="acc-btn" id="toggle-flat">b</span>
              </div>
              <!-- 도수 번호 on/off 토글 -->
              <!-- 라벨 모드 순환 버튼: 음이름 'C'(기본) → 도수 '7' → 미표시(음표 아이콘, 루시드 music — 음표 버튼과 같은 -4% 시각 보정). 상태는 scale-level.js _applyLabelModeUi가 갱신 -->
              <button class="finger-toggle active" id="degree-toggle-btn" data-mode="note" title="음이름 표시 (누르면 도수)">
                <i class="label-toggle-face"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g id="label-toggle-note" transform="translate(-0.96 0)" style="display:none"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g><text id="label-toggle-glyph" x="12" y="12" fill="currentColor" stroke="none" font-family="Pretendard, sans-serif" font-size="14" font-weight="700">C</text></svg></i>
              </button>
              <!-- 렛링(페달) on/off — OFF면 dot을 누르고 있는 동안만 소리남 -->
              <button class="finger-toggle active" id="letring-toggle-btn" title="렛링(울림 유지)">
                <!-- 루시드 형식 커스텀 아이콘(image/pedal.svg와 같은 도형) — 인라인이라 stroke=currentColor가 버튼 색(켜짐 흰색/꺼짐 회색)을 따라감 -->
                <i class="letring-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13,22h-2c-.81,0-1.97-1.01-2-1.99-.02-.63.06-1.25.21-1.86l.61-2.44c.12-.48.18-.96.18-1.46v-5.26c.03-.18-.1-1,1-1h2c.55,0,1,.45,1,1v5.26c0,.49.06.98.18,1.46l.61,2.44c.15.61.23,1.23.21,1.86-.03.98-1.19,1.99-2,1.99Z"/><rect x="8" y="2" width="8" height="6" rx="2" ry="2"/></svg></i>
              </button>
              <!-- 짝궁 전환 버튼 (Ch.2 전용) -->
              <button class="pair-transition-btn" id="pair-transition-btn" style="display:none">
                <i data-lucide="arrow-left-right"></i>
              </button>
            </div>
          </div>

          <div class="key-selector" id="key-selector"></div>

        </div>

      </header>

      <!-- 본문: 그룹 3개를 남는 높이에 균등 분배 -->
      <section class="cd-body">

        <!-- 그룹1: 프랫보드 -->
        <div class="scale-level-top">

          <div class="fretboard-row">
            <button class="fb-arrow-btn" id="fb-arrow-prev">
              <i data-lucide="chevron-left"></i>
            </button>

            <!-- 0~20프랫 슬라이딩 뷰포트 — 바깥(fb-viewport)은 좌우 여유공간이 있으면
                 옆 프렛을 살짝 더 보여주는 "고스트" 클립 영역까지 넓어짐(마스크로 페이드,
                 클릭 불가). 안쪽(fb-viewport-inner)은 실제 7프렛 폭 그대로, 클릭 가능 영역. -->
            <div class="fb-viewport" id="fb-viewport">
              <div class="fb-viewport-inner" id="fb-viewport-inner">
                <div class="fb-full-wrapper" id="fb-full-wrapper">
                  <div class="fb-full-neck" id="fb-full-neck"></div>
                  <div class="fb-full-nums" id="fb-full-nums"></div>
                </div>
              </div>
              <div class="fb-peek-blocker fb-peek-blocker--left" id="fb-peek-blocker-left"></div>
              <div class="fb-peek-blocker fb-peek-blocker--right" id="fb-peek-blocker-right"></div>
            </div>

            <button class="fb-arrow-btn" id="fb-arrow-next">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>

          <!-- 블럭 인디케이터 -->
          <div class="block-indicator" id="block-indicator"></div>

        </div>

        <!-- 그룹2: 마이크/재생 버튼 (독립 그룹) -->
        <div class="scale-mic-wrap">
          <div class="scale-mic-info" id="scale-mic-info">
            <div class="scale-mic-desc" id="scale-mic-desc">
              <div class="scale-mic-desc-row">
                <span class="scale-mic-desc-label">기타 버튼</span>
                <span class="scale-mic-desc-sep">|</span>
                <span class="scale-mic-desc-text">직접 연주해보기</span>
              </div>
              <div class="scale-mic-desc-row">
                <span class="scale-mic-desc-label">음표 버튼</span>
                <span class="scale-mic-desc-sep">|</span>
                <span class="scale-mic-desc-text">스케일 들어보기</span>
              </div>
            </div>
            <!-- 연습모드(기타 버튼 ON): desc 자리에 BPM - 재생 - 스타일 옵션이 같은 칸에 겹쳐서 교체 표시 -->
            <div class="scale-practice-panel" id="scale-practice-panel">
              <!-- 코드 진행 4마디 — 현재 키 기준으로 JS가 채움(renderPracticeChords) -->
              <div class="scale-practice-chords" id="scale-practice-chords"></div>
              <div class="scale-practice-opts" id="scale-practice-opts">
              <div class="metronome-option-card-wrap">
                <div class="metronome-option-card scale-practice-card" id="practice-bpm-card">
                  <span class="scale-practice-card-val" id="practice-bpm-value">90</span>
                  <span class="scale-practice-card-lbl">BPM</span>
                </div>
                <div class="metronome-option-menu hidden" id="practice-bpm-menu"></div>
              </div>
              <button class="scale-mic-btn" id="practice-play-btn">
                <i data-lucide="play"></i>
              </button>
              <div class="metronome-option-card-wrap">
                <div class="metronome-option-card scale-practice-card" id="practice-style-card">
                  <span class="scale-practice-card-val" id="practice-style-value">기본1</span>
                  <span class="scale-practice-card-lbl">스타일</span>
                </div>
                <div class="metronome-option-menu hidden" id="practice-style-menu"></div>
              </div>
              </div>
            </div>
          </div>
          <div class="scale-mic-btn-row">
            <button class="scale-mic-btn" id="scale-mic-btn">
              <i data-lucide="guitar"></i>
            </button>
            <button class="play-all-btn" id="scale-play-btn">
              <i data-lucide="music"></i>
            </button>
            <button class="scale-mic-btn scale-tutorial-btn" id="scale-tutorial-btn">
              <span class="scale-mic-help-glyph">?</span>
            </button>
          </div>
        </div>

        <!-- 그룹3: 암기 테스트 버튼 (독립 그룹) -->
        <div class="scale-test-btn-group">
          <button class="start-test-btn cd-btn cd-btn--brand cd-btn--auto-width" id="start-test-btn">
            <span id="start-test-btn-label">선택한 블럭 암기하기</span>
          </button>
        </div>

      </section>
    </main>

    <!-- ── 스케일 테스트 오버레이 ── -->
    <div class="scale-test-overlay" id="scale-test-overlay">
      <div class="scale-test-top">
        <button class="icon-btn" id="test-close-btn">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="scale-test-body">
        <p class="test-question-text" id="test-question-text"></p>
        <div class="test-note-grid" id="test-note-grid"></div>
        <div class="test-chord-labels" id="test-chord-labels"></div>
        <div class="scale-test-fb-wrap">
          <div class="test-fb-label-row">
            <span class="test-fb-form-label" id="test-fb-form-label"></span>
          </div>
          <div class="test-fb-neck-slot">
            <div id="test-fb-viewport">
              <div id="test-fb-full-wrapper">
                <div class="fb-full-neck" id="test-fb-full-neck"></div>
                <div class="fb-full-nums" id="test-fb-full-nums"></div>
              </div>
            </div>
            <button class="test-fb-arrow-btn test-fb-arrow-btn--prev" id="test-fb-arrow-prev">
              <i data-lucide="chevron-left"></i>
            </button>
            <button class="test-fb-arrow-btn test-fb-arrow-btn--next" id="test-fb-arrow-next">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>
        </div>
        <div class="test-result-row" id="test-result-row">
          <span class="test-result-score" id="test-result-score"></span>
          <span class="test-result-detail" id="test-result-detail"></span>
        </div>
        <div class="test-btn-row">
          <button class="test-back-btn" id="test-back-btn">돌아가기</button>
          <button class="test-submit-btn cd-btn cd-btn--brand" id="test-submit-btn">
            <span id="test-submit-btn-label">제출하기</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="scale-data.js"></script>
  <script src="guitar-samples.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="guitar-audio.js"></script>
  <script src="drum-sets.js"></script>
  <script src="drum-samples.js"></script>
  <script src="drum-audio.js"></script>
  <script src="backing-track.js"></script>
  <script src="chord-voicings.js"></script>
  <script src="scale-level.js"></script>
</body>
</html>
