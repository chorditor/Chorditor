<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 언어 결정·화면 번역: 다른 스크립트·본문보다 먼저 -->
  <script src="i18n.js"></script>
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 코드 에디터</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300;400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="page-editor">

  <!-- 페이지 커버: 초기화 완료 전 화면 가림 -->
  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 탑바 (style-guide.md §11 cd-topbar, B종) ── -->
    <header class="cd-topbar">
      <button id="back-btn" class="icon-btn" onpointerup="closeEditorPage()" aria-label="뒤로가기">
        <i data-lucide="chevron-left"></i>
      </button>
    </header>

    <!-- ── 메인 (style-guide.md §11 cd-main --stage: 자식이 스크롤·여백을 가짐) ── -->
    <main class="cd-main cd-main--stage">

      <!-- 코드 에디터 (home.html #view-editor에서 이식 — 마크업 그대로) -->
      <div class="view" id="view-editor">
        <!-- 에디터 컴포넌트 — 위에서부터 차례로: 제목 / 다이어그램 카드 / 액션바 / 추천 / 이름 휠 / 손가락 번호 -->
        <!-- 0. 페이지 제목 — 카드 위 -->
        <h1 class="ed-title">코드 에디터</h1>

        <!-- 1. 다이어그램 카드 — 중앙에 투명 배경 캔버스. 아래 옛 #c와 같은 상태(점·바레·뮤트·이름)를 그린다 -->
        <div class="ed-viewer-card" id="ed-viewer-card">
          <!-- 상단 줄: 좌측 샵/플랫 토글 · 우측 끝 초기화 -->
          <div class="ed-card-head">
            <!-- 샵/플랫 토글 — 옛 #acc-sharp/#acc-flat 토글과 상태를 같이 쓴다(setAccidental이 둘 다 갱신) -->
            <div class="accidental-toggle ed-acc-toggle" onclick="toggleAccidental()">
              <button class="acc-btn active" id="ed-acc-sharp">#</button>
              <button class="acc-btn" id="ed-acc-flat">b</button>
            </div>
            <!-- 초기화 — 옛 #btn-reset-chord와 같은 resetChord() -->
            <button class="ed-reset-btn" id="ed-btn-reset" type="button" onclick="resetChord()" title="초기화" aria-label="초기화">
              <i data-lucide="rotate-ccw"></i>
            </button>
          </div>
          <!-- 메인 영역(캔버스 + 우측 버튼 + 프렛 ◀ ▶ + 바레 막대) — 상단 줄 아래. 점 입력은 캔버스 탭, 프렛 번호는 캔버스 하단의 ◀ ▶, 바레는 아래 B 버튼 줄 -->
          <div class="ed-main-area">
            <canvas class="ed-canvas" id="c"></canvas>
            <!-- 이미지 저장·재생 — 캔버스 우측 거터(개방현 반대편)에 세로 배열. 옛 #canvas-main-btns와 같은 자리, 버튼 디자인은 사전과 동일 -->
            <div class="ed-side-btns">
              <button class="ed-tool-btn" id="btn-save-image" type="button" onclick="saveChordImage()" title="이미지 저장" aria-label="이미지 저장">
                <i data-lucide="image"></i>
              </button>
              <button class="ed-tool-btn" id="btn-play-chord" type="button" onclick="strumChord()" title="재생" aria-label="재생">
                <i data-lucide="play"></i>
              </button>
            </div>
            <!-- 프렛 번호 ◀ ▶ — 옛 #fret-ctrl과 같은 텍스트 화살표. 캔버스에 그려지는 프렛 번호 양옆 -->
            <div class="ed-fret-ctrl" id="fret-ctrl">
              <button class="ed-fret-btn" type="button" onclick="adjustFretNumber(-1)" aria-label="프렛 번호 내리기">&#9664;</button>
              <button class="ed-fret-btn" type="button" onclick="adjustFretNumber(1)" aria-label="프렛 번호 올리기">&#9654;</button>
            </div>
            <!-- 바레 막대 — 옛 #barre-wrap과 같은 회색 막대(프렛보드 폭). B 버튼은 editor.js(updateEdBarreBtns)가 채움 -->
            <div class="ed-barre-bar" id="barre-btns"></div>
          </div>
        </div>

        <!-- 2. 액션바 — 카드 아래, 왼쪽부터. (이미지 저장·재생은 캔버스 우측으로 옮김) -->
        <div class="ed-action-bar" id="ed-action-bar">
          <!-- 사전에서 가져오기 — 텍스트 알약(사전의 "에디터로 편집"과 같은 문법). 기능은 아직 연결하지 않음 -->
          <button class="ed-pill-btn" id="ed-btn-from-library" type="button">사전에서 가져오기</button>
          <!-- 노트에 저장 — openProjectSheet(). from_project 모드에선 editor.js가 "저장"으로 바꾼다 -->
          <button class="ed-pill-btn" id="btn-add-to-project" type="button" onclick="_playTap();openProjectSheet()">노트에 저장</button>
        </div>

        <!-- 상단(빠른 제작) / 하단(디테일 편집) 구분선 -->
        <hr class="ed-divider">

        <!-- 3. 하단 영역(디테일 편집 리스트) — 섹션 라벨 -->
        <h2 class="ed-section-label">추천 코드명<span class="ed-section-hint">터치해서 적용</span></h2>

        <!-- 3-1. 코드 이름 추천 막대 — 찍은 모양에서 자동 추천된 이름(옛 #chord-suggestions와 같은 데이터). 탭하면 그 이름으로 적용 -->
        <div class="ed-suggest-card" id="ed-suggest-bar"></div>

        <!-- 3-2. 코드명 커스텀 — 이름을 휠로 직접 지정하는 구역 (내용은 이 아래에 이어서 쌓는다) -->
        <h2 class="ed-section-label">코드명 커스텀<span class="ed-section-hint">이름을 직접 지정</span></h2>

        <!-- 3-3. 이름 휠 6개 — 근음·3화음·7음·기능·텐션·분수. 휠은 이름만 바꾼다(다이어그램은 건드리지 않음) -->
        <!-- 코드 휠 피커 -->
        <div class="chord-builder">
        <div class="wheel-picker">

              <div class="builder-col">
                <div class="col-label">기본</div>
                <div class="col-wheel-wrap">
                  <div class="col-scroll" id="root-group"></div>
                </div>
              </div>

              <div class="col-divider"></div>

              <div class="builder-col">
                <div class="col-label">3화음</div>
                <div class="col-wheel-wrap">
                  <div class="col-scroll" id="triad-group">
                    <button class="sel-btn active" onclick="selectTriad('')">M</button>
                    <button class="sel-btn" onclick="selectTriad('m')">m</button>
                    <button class="sel-btn" onclick="selectTriad('aug')">aug</button>
                    <button class="sel-btn" onclick="selectTriad('dim')">dim</button>
                  </div>
                </div>
              </div>

              <div class="col-divider"></div>

              <div class="builder-col">
                <div class="col-label">7음</div>
                <div class="col-wheel-wrap">
                  <div class="col-scroll" id="seventh-group">
                    <button class="sel-btn active" onclick="selectSeventh('')">-</button>
                    <button class="sel-btn" onclick="selectSeventh('M7')">M7</button>
                    <button class="sel-btn" onclick="selectSeventh('7')">7</button>
                    <button class="sel-btn" onclick="selectSeventh('6')">6</button>
                  </div>
                </div>
              </div>

              <div class="col-divider"></div>

              <div class="builder-col">
                <div class="col-label">기능</div>
                <div class="col-wheel-wrap">
                  <div class="col-scroll" id="func-group">
                    <button class="sel-btn active" onclick="selectFunc('')">-</button>
                    <button class="sel-btn" onclick="selectFunc('sus2')">sus2</button>
                    <button class="sel-btn" onclick="selectFunc('sus4')">sus4</button>
                    <button class="sel-btn" onclick="selectFunc('add9')">add9</button>
                    <button class="sel-btn" onclick="selectFunc('b5')">(b5)</button>
                  </div>
                </div>
              </div>

              <div class="col-divider"></div>

              <div class="builder-col">
                <div class="col-label">텐션</div>
                <div class="col-wheel-wrap">
                  <div class="col-scroll" id="tension-group">
                    <button class="sel-btn active" onclick="selectTension('')">-</button>
                    <button class="sel-btn" onclick="selectTension('b9')">b9</button>
                    <button class="sel-btn" onclick="selectTension('9')">9</button>
                    <button class="sel-btn" onclick="selectTension('#9')">#9</button>
                    <button class="sel-btn" onclick="selectTension('11')">11</button>
                    <button class="sel-btn" onclick="selectTension('#11')">#11</button>
                    <button class="sel-btn" onclick="selectTension('b13')">b13</button>
                    <button class="sel-btn" onclick="selectTension('13')">13</button>
                  </div>
                </div>
              </div>

              <div class="col-divider"></div>

              <div class="builder-col">
                <div class="col-label">베이스</div>
                <div class="col-wheel-wrap">
                  <div class="col-scroll" id="bass-group"></div>
                </div>
              </div>

            </div>
          </div>

        <!-- 3-4. 손가락 번호 — 번호 선택 UI는 이 아래에 이어서 쌓는다 -->
        <h2 class="ed-section-label">손가락 번호<span class="ed-section-hint ed-section-hint--block">지정할 손가락을 클릭 후, 상단에 점을 눌러 반영하세요.</span></h2>

        <!-- 3-5. 손가락 번호 지정 도구 — 없음 T 1 2 3 4. 고른 값이 상단 카드에서 탭한 점에 부여된다(selectFinger) -->
        <div class="ed-finger-row" id="ed-finger-row">
          <!-- 없음 — 기본 선택. 번호 없는 점을 찍거나, 점의 번호를 지울 때 -->
          <div class="ed-finger-item">
            <button class="ed-finger-btn selected" id="fn" type="button" onclick="selectFinger(null)">&ndash;</button>
            <span class="ed-finger-label">없음</span>
          </div>
          <div class="ed-finger-item">
            <button class="ed-finger-btn" id="f0" type="button" onclick="selectFinger(0)">T</button>
            <span class="ed-finger-label">엄지</span>
          </div>
          <div class="ed-finger-item">
            <button class="ed-finger-btn" id="f1" type="button" onclick="selectFinger(1)">1</button>
            <span class="ed-finger-label">검지</span>
          </div>
          <div class="ed-finger-item">
            <button class="ed-finger-btn" id="f2" type="button" onclick="selectFinger(2)">2</button>
            <span class="ed-finger-label">중지</span>
          </div>
          <div class="ed-finger-item">
            <button class="ed-finger-btn" id="f3" type="button" onclick="selectFinger(3)">3</button>
            <span class="ed-finger-label">약지</span>
          </div>
          <div class="ed-finger-item">
            <button class="ed-finger-btn" id="f4" type="button" onclick="selectFinger(4)">4</button>
            <span class="ed-finger-label">소지</span>
          </div>
        </div>

      </div>

    </main>

    <!-- ── 프로젝트 선택 바텀시트 ── -->
    <div id="project-sheet-overlay" class="project-sheet-overlay hidden" onclick="onProjectSheetOverlayClick(event)">
      <div class="project-sheet" id="project-sheet">
        <div class="project-sheet-handle"></div>
        <div class="project-sheet-header">
          <span class="project-sheet-title">노트에 추가</span>
          <button class="project-sheet-close" onclick="closeProjectSheet()" aria-label="닫기"><i data-lucide="x"></i></button>
        </div>
        <div class="project-sheet-list" id="project-sheet-list"></div>
      </div>
    </div>


    <!-- ── 일반 텍스트 토스트 ── -->
    <div id="text-toast" class="text-toast"></div>

  </div><!-- /app-shell -->

  <!-- ── 모달: 새 프로젝트 ── -->
  <div class="modal-overlay hidden" id="modal-create-project">
    <div class="modal" style="max-width:360px;">
      <div class="modal-header">
        <span class="modal-title" style="font-family:'Pretendard','Noto Sans JP',sans-serif;">새 노트</span>
        <button class="icon-btn" onclick="closeModal('modal-create-project')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" style="gap:12px;">
        <input type="text" id="create-project-name-input" class="share-code-input"
               placeholder="노트 이름" style="font-size:14px;font-family:inherit;" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-create-project')">취소</button>
        <button class="btn btn-primary" id="btn-confirm-create-note" onclick="confirmCreateProject()">만들기</button>
      </div>
    </div>
  </div>


  <!-- ── 저장 완료 체크 애니메이션 ── -->
  <div class="save-check-overlay" id="save-toast">
    <svg class="save-check-svg" viewBox="0 0 52 52">
      <circle class="save-check-circle" cx="26" cy="26" r="23" fill="none"/>
      <polyline class="save-check-mark" points="14,27 22,35 38,18" fill="none"/>
    </svg>
  </div>

  <!-- 이미지 저장 모달 (에디터/라이브러리 공용) -->
  <div class="img-save-backdrop" id="img-save-backdrop" onclick="closeImgSaveModal()"></div>
  <div class="img-save-modal" id="img-save-modal">
    <div class="ism-handle"></div>
    <div class="ism-header">
      <div class="ism-title">미리보기</div>
      <button class="ism-close" type="button" onclick="closeImgSaveModal()" aria-label="닫기">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="ism-preview">
      <canvas id="img-preview-canvas"></canvas>
    </div>
    <div class="ism-scale">
      <div class="ism-scale-row">
        <span class="ism-scale-label">배율</span>
        <span class="ism-scale-val" id="img-scale-val">1배 · 100×80 px</span>
      </div>
      <input type="range" id="img-scale-slider" class="ism-slider"
             min="0.5" max="3" step="0.5" value="1"
             oninput="onImgScaleInput(this.value)">
    </div>
    <div class="ism-bottom">
      <label class="ism-transparent" id="img-transparent-label">
        <input type="checkbox" id="img-transparent-chk" onchange="onImgTransparentToggle(this.checked)">
        <span>투명 배경으로 저장</span>
        <i class="ph-fill ph-crown-simple ism-premium-crown"></i>
      </label>
      <button class="ism-save-btn" id="img-save-btn" onclick="onImgSave()">저장</button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="guitar-samples.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="guitar-audio.js"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="voicing-canvas.js"></script>
  <script src="tutorial-steps.js"></script>
  <script src="tutorial.js"></script>
  <script src="chord-voicings.js"></script>
  <script src="editor.js"></script>

</body>
</html>
