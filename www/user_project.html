<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS (웹 인증용) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <!-- 페이지 커버: 초기화 완료 전 화면 가림, JS가 fade out 처리 -->
  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 탑바 (뒤로가기 영역) ── -->
    <div class="top-bar">
      <button id="back-btn" class="hidden" onpointerup="closeProjectPage()">
        <i data-lucide="x"></i>
      </button>
    </div>

    <!-- ── 메인 콘텐츠 ── -->
    <div class="main-content" id="main-content">

      <div class="tab-view" id="tab-view-project">
        <!-- ── 프로젝트 뷰 ── -->
        <div class="view" id="view-project">
          <!-- JS로 렌더링 -->
        </div>
      </div>

    </div><!-- /main-content -->


    <!-- 플랜 배지 (숨김 상태 유지, JS 참조용) -->
    <span id="sidebar-plan-badge" class="plan-badge" data-plan="free" style="display:none">FREE</span>

  </div><!-- /app-shell -->

  <!-- ── 모달: 뷰 ── -->
  <div class="modal-overlay hidden" id="modal-view">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-view-title"></span>
        <button class="icon-btn" onclick="closeModal('modal-view')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" style="align-items:center;">
        <div class="canvas-inner" style="width:240px;">
          <canvas id="modal-view-canvas"></canvas>
        </div>
        <div class="btn-group">
          <button class="btn btn-ghost" id="modal-view-play">▶ 재생</button>
          <button class="btn btn-primary" onclick="switchToEditModal()">✏️ 편집</button>
        </div>
      </div>
    </div>
  </div>


  <!-- ── 모달: 공유 ── -->
  <div class="modal-overlay hidden" id="modal-share">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">공유 코드</span>
        <button class="icon-btn" onclick="closeModal('modal-share')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" style="gap:16px;">
        <p class="hint">코드 배열(가사 제외)을 공유합니다.</p>
        <div class="share-field-group">
          <span class="share-label">공유 코드</span>
          <div class="share-row">
            <input type="text" id="share-code-input" class="share-code-input" readonly />
            <button class="btn btn-ghost" id="share-code-copy-btn" onclick="copyShareCode()">복사</button>
          </div>
        </div>
        <div class="share-field-group">
          <span class="share-label">앱 URL</span>
          <div class="share-row">
            <input type="text" id="share-url-input" class="share-code-input" readonly />
            <button class="btn btn-ghost" id="share-url-copy-btn" onclick="copyShareUrl()">복사</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 모달: 가져오기 ── -->
  <div class="modal-overlay hidden" id="modal-import">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">코드 배열 가져오기</span>
        <button class="icon-btn" onclick="closeModal('modal-import')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" style="gap:16px;">
        <p class="hint" id="import-meta"></p>
        <div class="share-field-group">
          <span class="share-label">기존 프로젝트에 추가</span>
          <div class="share-row">
            <select id="import-project-select" class="export-select" style="flex:1"></select>
            <button class="btn btn-primary" onclick="confirmImport('existing')">가져오기</button>
          </div>
        </div>
        <div class="share-field-group">
          <span class="share-label">새 프로젝트로 가져오기</span>
          <div class="share-row">
            <input type="text" id="import-new-name" class="share-code-input" placeholder="새 프로젝트 이름" />
            <button class="btn btn-primary" onclick="confirmImport('new')">만들기</button>
          </div>
        </div>
        <div class="share-field-group">
          <span class="share-label">함께 적용할 설정</span>
          <div class="import-settings-row">
            <label><input type="checkbox" id="import-apply-bpm" checked /> BPM</label>
            <label><input type="checkbox" id="import-apply-capo" checked /> Capo</label>
            <label><input type="checkbox" id="import-apply-col" checked /> 칸 수</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 모달: 새 프로젝트 ── -->
  <div class="modal-overlay hidden" id="modal-create-project">
    <div class="modal" style="max-width:360px;">
      <div class="modal-header">
        <span class="modal-title">새 프로젝트</span>
        <button class="icon-btn" onclick="closeModal('modal-create-project')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" style="gap:12px;">
        <input type="text" id="create-project-name-input" class="share-code-input"
               placeholder="프로젝트 이름" style="font-size:14px;font-family:inherit;" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-create-project')">취소</button>
        <button class="btn btn-primary" onclick="confirmCreateProject()">만들기</button>
      </div>
    </div>
  </div>

  <!-- ── 모달: 프로젝트 삭제 확인 ── -->
  <div class="modal-overlay hidden" id="delete-confirm-overlay" onclick="closeDeleteConfirm()">
    <div class="delete-confirm-modal" onclick="event.stopPropagation()">
      <h3 class="delete-confirm-title">프로젝트 삭제</h3>
      <p class="delete-confirm-desc">삭제된 프로젝트는 복구할 수 없어요.<br>정말 삭제하시겠어요?</p>
      <p class="delete-confirm-tip">삭제 전 공유하기로 코드 배열을 백업해두세요.</p>
      <div class="delete-confirm-actions">
        <button class="btn btn-ghost" onclick="closeDeleteConfirm()">취소</button>
        <button class="btn btn-danger" id="delete-confirm-btn">삭제</button>
      </div>
    </div>
  </div>

  <!-- ── 모달: 업그레이드 유도 ── -->
  <div class="modal-overlay hidden" id="upgrade-modal-overlay" onclick="closeUpgradeModal()">
    <div class="modal upgrade-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title" id="upgrade-modal-title">플랜 업그레이드가 필요합니다</span>
      </div>
      <div class="upgrade-modal-body">
        <p id="upgrade-modal-desc"></p>
      </div>
      <div class="modal-footer upgrade-actions">
        <button class="btn btn-ghost" onclick="closeUpgradeModal()">닫기</button>
        <button class="btn btn-primary" onclick="closeUpgradeModal(); openPlanModal()">요금제 보기</button>
      </div>
    </div>
  </div>

  <!-- ── 모달: 공지 팝업 ── -->
  <div class="modal-overlay hidden" id="notice-modal-overlay" onclick="closeNoticeModal()">
    <div class="notice-modal" onclick="event.stopPropagation()">
      <div class="notice-modal-icon">🎉</div>
      <h3 class="notice-modal-title" id="notice-modal-title"></h3>
      <p class="notice-modal-message" id="notice-modal-message"></p>
      <button class="notice-modal-btn" onclick="closeNoticeModal()">확인</button>
    </div>
  </div>

  <!-- ── 저장 공간 경고 토스트 ── -->
  <div class="storage-warning hidden" id="storage-warning">
    저장 공간이 부족합니다. 일부 내용이 저장되지 않을 수 있어요.
  </div>

  <!-- ── 저장 완료 체크 애니메이션 ── -->
  <div class="save-check-overlay" id="save-toast">
    <svg class="save-check-svg" viewBox="0 0 52 52">
      <circle class="save-check-circle" cx="26" cy="26" r="23" fill="none"/>
      <polyline class="save-check-mark" points="14,27 22,35 38,18" fill="none"/>
    </svg>
  </div>


  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script src="guitar-samples.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="guitar-audio.js"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="user_project.js"></script>

  <!-- 이미지 저장 배율 드롭다운 (에디터/라이브러리 공용) -->
  <div class="scale-dropdown" id="scale-dropdown">
    <div class="scale-dropdown-item" data-scale="0.5" onclick="onScaleSelect(this)"><span>0.5배</span><span>50×40 px</span></div>
    <div class="scale-dropdown-item" data-scale="1"   onclick="onScaleSelect(this)"><span>1배</span><span>100×80 px</span></div>
    <div class="scale-dropdown-item" data-scale="2"   onclick="onScaleSelect(this)"><span>2배</span><span>200×160 px</span></div>
    <div class="scale-dropdown-item" data-scale="3"   onclick="onScaleSelect(this)"><span>3배</span><span>300×240 px</span></div>
  </div>

  <div id="exit-toast"></div>
</body>
</html>
