<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 훈련소</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="training-flow-page">

  <!-- 페이지 커버: 초기화 완료 전 화면 가림 -->
  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 탑바 ── -->
    <div class="top-bar">
      <button id="back-btn" class="icon-btn" onpointerup="closeTrainingPage()">
        <i data-lucide="x"></i>
      </button>
      <div class="topbar-currency" id="topbar-currency" style="margin-left:auto;margin-right:15px;">
        <div class="currency-item currency-item--clickable" onclick="openPeakboxModal()">
          <span class="currency-count" id="currency-peakbox-count">0</span>
          <div class="currency-icon-box"><img src="image/gift.png" alt=""></div>
        </div>
        <div class="currency-item currency-item--clickable" onclick="openPeakTimerPopup(event)">
          <span class="currency-count" id="currency-peak-count">30/30</span>
          <div class="currency-icon-box"><img src="image/peak.svg" alt=""></div>
        </div>
      </div>
    </div>

    <!-- ── 메인 콘텐츠 ── -->
    <div class="main-content" id="main-content">
      <div class="training-scroll">

        <!-- 0. 페이지 타이틀 -->
        <span class="training-page-title">훈련소</span>

        <!-- 1. 통계 섹션 -->
        <div class="training-stats-wrap">
          <div class="training-stats-icon"><i class="ph-fill ph-chart-bar"></i></div>
          <span class="training-stats-title">훈련 통계</span>
          <div class="training-stats-row">
            <div class="training-stat-card">
              <span class="training-stat-value" id="stat-streak">0</span>
              <span class="training-stat-label">연속 기록</span>
            </div>
            <div class="training-stat-card">
              <span class="training-stat-value" id="stat-time">—</span>
              <span class="training-stat-label">훈련 시간</span>
            </div>
            <div class="training-stat-card">
              <span class="training-stat-value" id="stat-total">0</span>
              <span class="training-stat-label">훈련 완료</span>
            </div>
          </div>
        </div>

        <!-- 2. 훈련 카드 그리드 -->
        <div class="training-section-label">훈련 목록</div>
        <div class="training-grid">

          <!-- 코드 맞추기 -->
          <div class="training-card training-card--chord-name" data-key="chord-name">
            <div class="training-card-icon"><i class="ph-fill ph-grid-nine"></i></div>
            <div class="training-card-bottom">
              <span class="training-card-name">코드 <br>맞추기</span>
            </div>
          </div>

          <!-- 스케일 훈련 -->
          <div class="training-card training-card--chord-diagram" data-key="scale">
            <div class="training-card-icon"><i class="ph-fill ph-music-notes"></i></div>
            <div class="training-card-bottom">
              <span class="training-card-name">스케일 <br>훈련</span>
            </div>
          </div>

          <!-- 코드 진행 리스트 -->
          <div class="training-card training-card--rhythm" data-key="progression">
            <div class="training-card-icon"><i class="ph-fill ph-rows-plus-bottom"></i></div>
            <div class="training-card-bottom">
              <span class="training-card-name">코드 진행 <br>리스트</span>
            </div>
          </div>

          <!-- 주법 리듬 훈련 -->
          <div class="training-card training-card--strumming" data-key="strumming">
            <div class="training-card-icon"><i class="ph-fill ph-metronome"></i></div>
            <div class="training-card-bottom">
              <span class="training-card-name">주법 리듬 <br>훈련</span>
            </div>
          </div>

          <!-- 코드 조합 훈련 (패밀리코드 훈련 + 리하모니 퀴즈 통합) -->
          <div class="training-card training-card--reharmony" data-key="reharmony">
            <div class="training-card-icon"><i class="ph-fill ph-pencil"></i></div>
            <div class="training-card-bottom">
              <span class="training-card-name">코드 조합 <br>훈련</span>
            </div>
          </div>

          <!-- 코드 청음 챌린지 -->
          <div class="training-card training-card--soon training-card--fretboard" data-key="ear-training">
            <div class="training-card-icon"><i class="ph-fill ph-headphones"></i></div>
            <div class="training-card-bottom">
              <span class="training-card-soon-badge">Coming Soon</span>
              <span class="training-card-name">코드 청음 <br>챌린지</span>
            </div>
          </div>

          <!-- 리하모니 청음 챌린지 -->
          <div class="training-card training-card--soon training-card--reharmony-ear" data-key="reharmony-ear">
            <div class="training-card-icon"><i class="ph-fill ph-speaker-simple-high"></i></div>
            <div class="training-card-bottom">
              <span class="training-card-soon-badge">Coming Soon</span>
              <span class="training-card-name">리하모니 청음 <br>챌린지</span>
            </div>
          </div>

        </div><!-- /training-grid -->

      </div><!-- /training-scroll -->
    </div><!-- /main-content -->

  </div><!-- /app-shell -->

  <!-- ── 튜토리얼 진행 레이어 (home.html과 동일 구조) ── -->
  <div id="tut-layer" class="hidden">
    <div id="tut-panel">
      <button id="tut-skip" onclick="Tutorial.confirmSkip()">건너뛰기</button>
      <h4 id="tut-title"></h4>
      <p id="tut-text"></p>
      <button id="tut-next" disabled onclick="Tutorial.next()">다음</button>
    </div>
  </div>

  <!-- 스와이프 유도 dot — 레이어 밖 body 직속. 어떤 요소에도 안 가리도록 최상위에 둔다 -->
  <div id="tut-scrollhint" hidden><div class="tut-swipe-dot"></div></div>

  <!-- ── 튜토리얼 스텝 완료 모달 (home.html과 동일 구조) ──
       STEP5는 이 페이지에서 끝나므로 여기에도 있어야 한다. -->
  <div class="modal-overlay hidden" id="tutorial-done-overlay">
    <div class="tutorial-start-modal" onclick="event.stopPropagation()">
      <img src="image/confetti.png" alt="" class="tutorial-start-logo">
      <h3 class="tutorial-start-title" id="tutorial-done-title"></h3>
      <p class="tutorial-start-message" id="tutorial-done-message"></p>
      <div class="event-modal-reward" id="tutorial-done-reward">
        <img src="image/gift.png" alt="">
        <span id="tutorial-done-reward-count"></span>
      </div>
      <div class="tutorial-start-actions">
        <button class="btn btn-ghost" id="tutorial-done-later" onclick="Tutorial.closeDoneModal()">나중에 할게요</button>
        <button class="btn btn-primary hidden" id="tutorial-done-continue" onclick="Tutorial.continueNext()">다음 스텝 계속하기</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="tutorial-steps.js"></script>
  <script src="tutorial.js"></script>
  <script src="training.js"></script>
</body>
</html>
