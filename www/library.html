<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 언어 결정·화면 번역: 다른 스크립트·본문보다 먼저 -->
  <script src="i18n.js"></script>
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 코드 사전</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300;400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <!-- 페이지 커버: 초기화 완료 전 화면 가림 -->
  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 탑바 (style-guide.md §11 cd-topbar, B종) — 가로 스플릿 뷰에선 숨김(cd-topbar--split-hidden) ── -->
    <header class="cd-topbar cd-topbar--white cd-topbar--split-hidden">
      <button id="back-btn" class="icon-btn" onpointerup="closeLibraryPage()" aria-label="뒤로가기">
        <i data-lucide="chevron-left"></i>
      </button>
    </header>

    <!-- ── 메인 (style-guide.md §11 cd-main --stage: 자식이 스크롤·여백을 가짐) ── -->
    <main class="cd-main cd-main--stage">

      <div class="view" id="view-library">

        <!-- 사전패널 — 가로 배치(스플릿 뷰)에서만 보이는 좌측 카드. 세로 배치에선 CSS로 숨김.
             가로에선 탑바(cd-topbar--split-hidden)가 숨겨지므로 뒤로가기는 패널 안에 둔다 -->
        <div class="lib-panel" id="lib-panel">
          <!-- 패널 상단 줄: 우측 끝에 [#/b 토글][검색]. 홈으로 이동은 코드뷰 상단의 홈 아이콘이 담당 -->
          <div class="lib-panel-head">
            <!-- 우측 도구 묶음(우측 끝 고정): [샵/플랫 토글][검색]. 검색이 왼쪽으로 늘어나면 토글도 같이 밀려 이동.
                 샵/플랫 토글(.accidental-toggle)은 home 와이드일 때 library.js가 액션바에서 이 안으로 옮겨옴 -->
            <div class="lib-panel-tools" id="lib-panel-tools">
              <!-- 검색: 아이콘(좌)+입력창(우). 우측 끝에 고정된 컨테이너가 .open이면 왼쪽으로 늘어나며
                   아이콘이 컨테이너 왼쪽 끝에 붙어 같이 끌려가고 입력창이 드러남. 입력하면 글자마다 코드 그리드가 결과로 바뀜 -->
              <div class="lib-panel-search" id="lib-panel-search">
                <button class="icon-btn lib-panel-search-btn" id="lib-panel-search-btn"
                        onpointerdown="event.preventDefault()" onclick="toggleLibPanelSearch()" aria-label="검색">
                  <i data-lucide="search"></i>
                </button>
                <input type="text" class="lib-panel-search-input" id="lib-panel-search-input"
                       placeholder="코드 검색" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                       oninput="onLibPanelSearchInput(this.value)"
                       onkeydown="if(event.key==='Enter'){this.blur();}" />
              </div>
            </div>
          </div>

          <!-- 12key 셀렉터: 상단 줄 아래에 항상 표시. 32px 정사각형 1줄 가로 스크롤. JS(renderLibPanelKeys)가 채움 -->
          <div class="lib-panel-keys-track" id="lib-panel-keys-track"></div>
        </div>

        <!-- 코드뷰 상단 줄 — 가로 배치(스플릿 뷰)에서만 보임. 좌측 끝 "코드사전", 우측 끝 [에디터로 편집][노트에 저장].
             버튼은 library.js가 기존 #lib-btn-to-editor / #lib-btn-save-note를 옮겨 넣는다 -->
        <div class="lib-codeview-head" id="lib-codeview-head">
          <span class="lib-codeview-title">코드사전</span>
          <!-- 우측 묶음: [에디터로 편집][노트에 저장](JS가 채움) + 홈 아이콘(홈 탭 독바와 같은 lucide home) -->
          <div class="lib-codeview-right">
            <div class="lib-codeview-actions" id="lib-codeview-actions"></div>
            <button class="lib-codeview-home" id="lib-codeview-home" onpointerup="closeLibraryPage()" aria-label="홈으로">
              <i data-lucide="home"></i>
            </button>
          </div>
        </div>

        <!-- 페이지 제목 -->
        <div class="lib-title">
          <span class="home-section-label lib-page-title">코드 사전</span>
        </div>

        <!-- 1. 검색 섹션 -->
        <div class="lib-search-bar">
          <i data-lucide="search" class="lib-search-icon"></i>
          <input type="text" id="lib-search"
                 placeholder="코드 검색... (C, Am, G7)"
                 oninput="onLibSearch(this.value)"
                 onkeydown="if(event.key==='Enter'){event.target.blur();showLibSearchModal();}" />
        </div>

        <!-- 2. 다이어그램 섹션: 캔버스 + 사이드버튼 + 운지 내비게이션 -->
        <div class="lib-viewer">
          <div class="lib-canvas-row">
            <canvas id="lib-canvas"></canvas>
            <div class="lib-canvas-side-btns">
              <button class="canvas-side-btn" id="lib-btn-save-image" onclick="libSaveImage()" title="이미지 저장">
                <i data-lucide="image"></i>
              </button>
              <button class="canvas-side-btn" id="lib-btn-play" onclick="libPlayChord()" title="재생">
                <i data-lucide="play"></i>
              </button>
            </div>
          </div>
          <div class="lib-fingering-nav" id="lib-fingering-nav" style="display:none;">
            <button class="lib-fingering-btn" onclick="prevLibFingering()">
              <i data-lucide="chevron-left"></i>
            </button>
            <span class="lib-fingering-label">1 / 2</span>
            <button class="lib-fingering-btn" onclick="nextLibFingering()">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>
          <!-- 다이어그램·운지 넘김 버튼 아래: 이미지 저장 + 재생(가로 배치에서 library.js가 기존 버튼을 옮겨 넣음) -->
          <div class="lib-codeview-tools" id="lib-codeview-tools"></div>
        </div>

        <!-- 3+4. 액션바 + 코드목록 묶음 -->
        <div class="lib-bottom-area">
          <div class="lib-action-section">
            <div class="lib-action-bar">
              <div class="accidental-toggle" onclick="toggleLibAccidental()">
                <button class="acc-btn active" id="lib-acc-sharp">#</button>
                <button class="acc-btn" id="lib-acc-flat">b</button>
              </div>
              <button class="mode-btn active" id="lib-finger-btn"
                      onclick="toggleLibFingerNum()" title="손가락 번호">
                <i class="ph-bold ph-hand"></i>
              </button>
              <span class="ab-spacer"></span>
              <button class="ab-btn" id="lib-btn-save-note" onclick="libSaveToProject()">노트에 저장</button>
              <button class="ab-btn ab-btn-primary" id="lib-btn-to-editor" onclick="importLibChordToProject()">에디터로</button>
            </div>

            <!-- 손가락 번호 팁 — 가로 배치(스플릿 뷰)에서만 표시. 5개 컴포넌트(.lib-finger-tip-item)를 균등 분배.
                 항목 하나 = 표기(mark) + 이름(name) -->
            <div class="lib-finger-tip" aria-label="손가락 번호 안내">
              <!-- 손가락 번호 버튼(#lib-finger-btn)이 가로 배치에서 library.js로 여기 옮겨져 설명 왼쪽에 놓인다 -->
              <div class="lib-finger-tip-slot" id="lib-finger-tip-slot"></div>
              <div class="lib-finger-tip-items">
                <div class="lib-finger-tip-item">
                  <span class="lib-finger-tip-mark">T</span>
                  <span class="lib-finger-tip-name">엄지</span>
                </div>
                <div class="lib-finger-tip-item">
                  <span class="lib-finger-tip-mark">1</span>
                  <span class="lib-finger-tip-name">검지</span>
                </div>
                <div class="lib-finger-tip-item">
                  <span class="lib-finger-tip-mark">2</span>
                  <span class="lib-finger-tip-name">중지</span>
                </div>
                <div class="lib-finger-tip-item">
                  <span class="lib-finger-tip-mark">3</span>
                  <span class="lib-finger-tip-name">약지</span>
                </div>
                <div class="lib-finger-tip-item">
                  <span class="lib-finger-tip-mark">4</span>
                  <span class="lib-finger-tip-name">소지</span>
                </div>
              </div>
            </div>
          </div><!-- /lib-action-section -->

          <!-- 4. 코드 목록: 근음 세로(좌) + 카드 그리드(우) -->
          <div class="lib-bottom">
            <div class="lib-root-list" id="lib-root-tabs"></div>
            <div class="lib-cards-area">
              <div class="lib-cards" id="lib-cards"></div>
            </div>
            <div class="lib-voicing-overlay" id="lib-voicing-overlay"
                 onclick="closeVoicingModal()"></div>
            <div class="lib-voicing-modal" id="lib-voicing-modal"
                 onclick="closeVoicingModal()">
              <div class="lib-voicing-grid" id="lib-voicing-grid"></div>
            </div>
          </div>
        </div><!-- /lib-bottom-area -->

        <!-- 검색 결과 모달 -->
        <div class="lib-search-modal" id="lib-search-modal">
          <div class="lib-search-modal-header">
            <span class="lib-search-modal-title" id="lib-search-modal-title"></span>
            <button class="icon-btn" id="lib-search-close" onclick="closeLibSearchModal()">
              <i data-lucide="x"></i>
            </button>
          </div>
          <div class="lib-cards" id="lib-search-cards"></div>
        </div>


    </main>

    <!-- ── 프로젝트 선택 바텀시트 ── -->
    <div id="project-sheet-overlay" class="project-sheet-overlay hidden" onclick="onProjectSheetOverlayClick(event)">
      <div class="project-sheet" id="project-sheet">
        <div class="project-sheet-handle"></div>
        <div class="project-sheet-header">
          <span class="project-sheet-title">노트에 추가</span>
          <button class="project-sheet-close" onclick="closeProjectSheet()">✕</button>
        </div>
        <div class="project-sheet-list" id="project-sheet-list"></div>
      </div>
    </div>


    <!-- ── 일반 텍스트 토스트 ── -->
    <div id="text-toast" class="text-toast"></div>

  </div><!-- /app-shell -->

  <!-- ── 모달: 새 프로젝트 ── -->
  <div class="modal-overlay hidden" id="modal-create-project">
    <div class="modal" style="max-width:360px;">
      <div class="modal-header">
        <span class="modal-title" style="font-family:'Pretendard','Noto Sans JP',sans-serif;">새 노트</span>
        <button class="icon-btn" onclick="closeModal('modal-create-project')"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" style="gap:12px;">
        <input type="text" id="create-project-name-input" class="share-code-input"
               placeholder="노트 이름" style="font-size:14px;font-family:inherit;" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-create-project')">취소</button>
        <button class="btn btn-primary" id="btn-confirm-create-note" onclick="confirmCreateProject()">만들기</button>
      </div>
    </div>
  </div>


  <!-- ── 저장 완료 체크 애니메이션 ── -->
  <div class="save-check-overlay" id="save-toast">
    <svg class="save-check-svg" viewBox="0 0 52 52">
      <circle class="save-check-circle" cx="26" cy="26" r="23" fill="none"/>
      <polyline class="save-check-mark" points="14,27 22,35 38,18" fill="none"/>
    </svg>
  </div>

  <!-- 이미지 저장 모달 (에디터/라이브러리 공용) -->
  <div class="img-save-backdrop" id="img-save-backdrop" onclick="closeImgSaveModal()"></div>
  <div class="img-save-modal" id="img-save-modal">
    <div class="ism-handle"></div>
    <div class="ism-preview">
      <canvas id="img-preview-canvas"></canvas>
    </div>
    <div class="ism-scale">
      <div class="ism-scale-row">
        <span class="ism-scale-label">배율</span>
        <span class="ism-scale-val" id="img-scale-val">1배 · 100×80 px</span>
      </div>
      <input type="range" id="img-scale-slider" class="ism-slider"
             min="0.5" max="3" step="0.5" value="1"
             oninput="onImgScaleInput(this.value)">
    </div>
    <div class="ism-bottom">
      <label class="ism-transparent" id="img-transparent-label">
        <input type="checkbox" id="img-transparent-chk" onchange="onImgTransparentToggle(this.checked)">
        <span>투명 배경으로 저장</span>
        <i class="ph-fill ph-crown-simple ism-premium-crown"></i>
      </label>
      <button class="ism-save-btn" id="img-save-btn" onclick="onImgSave()">저장</button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="guitar-samples.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="guitar-audio.js"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="voicing-canvas.js"></script>
  <script src="tutorial-steps.js"></script>
  <script src="tutorial.js"></script>
  <script src="chord-voicings.js"></script>
  <script src="chords-library.js"></script>
  <script src="voicing-library.js"></script>
  <script src="library.js"></script>

</body>
</html>
