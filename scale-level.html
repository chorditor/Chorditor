<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 스케일 훈련</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 탑바 ── -->
    <div class="top-bar top-bar--white">
      <button id="back-btn" class="icon-btn" onpointerup="closeScaleLevel()">
        <i data-lucide="chevron-left"></i>
      </button>
      <span class="top-bar-title"></span>
      <div class="topbar-currency" id="topbar-currency" style="margin-left:auto;margin-right:15px;">
        <div class="currency-item currency-item--clickable" onclick="openPeakboxModal()">
          <span class="currency-count" id="currency-peakbox-count">0</span>
          <div class="currency-icon-box"><img src="image/gift.png" alt=""></div>
        </div>
        <div class="currency-item currency-item--clickable" onclick="openPeakTimerPopup(event)">
          <span class="currency-count" id="currency-peak-count">30/30</span>
          <div class="currency-icon-box"><img src="image/peak.svg" alt=""></div>
        </div>
      </div>
    </div>

    <!-- ── 메인 콘텐츠 ── -->
    <div class="main-content" id="main-content">
      <div class="scale-level-layout">

        <!-- 상단: 프랫보드 -->
        <div class="scale-level-top">

          <div class="form-label" id="form-label"></div>

          <div class="fretboard-row">
            <button class="fb-arrow-btn" id="fb-arrow-prev">
              <i data-lucide="chevron-left"></i>
            </button>

            <!-- 0~20프랫 슬라이딩 뷰포트 -->
            <div class="fb-viewport" id="fb-viewport">
              <div class="fb-full-wrapper" id="fb-full-wrapper">
                <div class="fb-full-neck" id="fb-full-neck"></div>
                <div class="fb-full-nums" id="fb-full-nums"></div>
              </div>
            </div>

            <button class="fb-arrow-btn" id="fb-arrow-next">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>

          <!-- 블럭 인디케이터 -->
          <div class="block-indicator" id="block-indicator"></div>

        </div>

        <!-- 하단: 키 선택 -->
        <div class="scale-level-bottom">
          <div class="key-selector-section">
            <div class="accidental-toggle-row">
              <div class="accidental-toggle" id="accidental-toggle">
                <span class="acc-btn active" id="toggle-sharp">#</span>
                <span class="acc-btn" id="toggle-flat">b</span>
              </div>
              <!-- 도수 번호 on/off 토글 -->
              <button class="finger-toggle" id="degree-toggle-btn" title="도수 번호 표시">
                <i class="ph-bold ph-list-numbers"></i>
              </button>
              <!-- 짝궁 전환 버튼 (Ch.2 전용) -->
              <button class="pair-transition-btn" id="pair-transition-btn" style="display:none">
                <i data-lucide="arrow-left-right"></i>
              </button>
            </div>
            <span class="key-selector-label">KEY</span>
            <div class="key-selector" id="key-selector"></div>
            <button class="start-test-btn" id="start-test-btn">
              <span id="start-test-btn-label"></span>
              <span class="stt-peak-cost" id="stt-peak-cost">
                <img src="image/white_peak.svg" alt="" class="stt-peak-cost-icon">
                <span class="stt-peak-cost-count">x2</span>
              </span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- ── 스케일 테스트 오버레이 ── -->
    <div class="scale-test-overlay" id="scale-test-overlay">
      <div class="scale-test-top">
        <button class="icon-btn" id="test-close-btn">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="scale-test-body">
        <p class="test-question-text" id="test-question-text"></p>
        <div class="scale-test-fb-wrap">
          <div class="fb-full-neck" id="test-fb-full-neck"></div>
          <div class="fb-full-nums" id="test-fb-full-nums"></div>
        </div>
        <div class="test-result-row" id="test-result-row">
          <span class="test-result-score" id="test-result-score"></span>
          <span class="test-result-detail" id="test-result-detail"></span>
        </div>
        <div class="test-btn-row">
          <button class="test-back-btn" id="test-back-btn">돌아가기</button>
          <button class="test-submit-btn" id="test-submit-btn">
            <span id="test-submit-btn-label">제출하기</span>
            <span class="stt-peak-cost" id="test-retry-peak-cost" style="display:none">
              <img src="image/white_peak.svg" alt="" class="stt-peak-cost-icon">
              <span class="stt-peak-cost-count">x2</span>
            </span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="scale-data.js"></script>
  <script src="shuffle-bag.js"></script>
  <script src="guitar-samples.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="guitar-audio.js"></script>
  <script src="scale-level.js"></script>
</body>
</html>
