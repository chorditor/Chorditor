<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 출석체크</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="training-flow-page">

  <!-- 페이지 커버: 초기화 완료 전 화면 가림 -->
  <div id="page-cover"></div>

  <div class="app-shell" id="attendance-page">

    <!-- ── 앱 로고탑바(데스크탑 전용) ── -->
    <div class="top-bar desktop-topbar"></div>

    <!-- ── 메인 콘텐츠 ── -->
    <div class="main-content" id="main-content">

      <!-- ── 뒤로가기 전용 ── -->
      <div class="top-bar">
        <button id="back-btn" class="icon-btn" onpointerup="closeAttendancePage()">
          <i data-lucide="chevron-left"></i>
        </button>
      </div>

      <div class="attendance-scroll">
        <div class="attendance-scroll-inner">
          <span class="attendance-title">출석체크</span>
          <div class="attendance-desc-block">
            <p class="attendance-desc">매일의 <span class="dm-gate-desc-accent">훈련 루틴</span>을 완료해서 <span class="dm-gate-desc-accent">출석</span>해요</p>
            <p class="attendance-desc">꾸준히 연습해서 실력을 키워봐요!</p>
          </div>
          <div class="attendance-cta-row">
            <button class="attendance-cta-link" id="attendance-cta-btn" onclick="attendanceCtaClick()">
              <span id="attendance-cta-label">오늘의 훈련 루틴 하러가기</span> <i data-lucide="chevron-right" class="attendance-cta-link-icon"></i>
            </button>
          </div>
          <img src="image/calender.png" class="attendance-cal-icon" alt="">
          <div class="attendance-main">
            <span class="attendance-month" id="attendance-month"></span>
            <div class="attend-cal-grid" id="attendance-cal-grid"></div>
            <span class="attendance-status" id="attendance-status"></span>
            <div class="attendance-makeup-row">
              <button class="attendance-makeup-btn" id="attendance-makeup-btn" onclick="attendanceMakeupClick()">
                보충출석 <span class="attendance-makeup-count" id="attendance-makeup-count">3</span>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="attendance.js"></script>
</body>
</html>
