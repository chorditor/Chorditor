<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 언어 결정·화면 번역: 다른 스크립트·본문보다 먼저 -->
  <script src="i18n.js"></script>
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 오늘의 미션</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="training-flow-page">

  <!-- 페이지 커버: 초기화 완료 전 화면 가림 -->
  <div id="page-cover"></div>

  <!-- 일일 미션 + 출석 통합 페이지 (2026-10-31): 매일 첫 접속 때 뜨던 데일리미션 게이트를 대체. 뼈대는 style-guide.md §11 -->
  <div class="app-shell" id="attendance-page">

    <!-- ── 뒤로가기/닫기 전용 (첫 접속 진입이면 JS가 아이콘을 X로 교체) ── -->
    <header class="cd-topbar">
      <button id="back-btn" class="icon-btn" onpointerup="closeAttendancePage()" aria-label="닫기">
        <i data-lucide="chevron-left" id="dm-back-icon"></i>
      </button>
    </header>

    <main class="cd-main" id="main-content">

      <header class="cd-head">
        <div class="cd-title"><img src="image/calender.png" class="dm-title-icon" alt="">오늘의 미션</div>
        <p class="dm-desc">4개 중 <span class="dm-desc-accent">2개</span>를 완료하면 <span class="dm-desc-accent">출석</span>해요!</p>
      </header>

      <section class="cd-body">
        <!-- 미션 4개 — JS가 채움 -->
        <ul class="dm-missions" id="dm-missions"></ul>

        <!-- 출석 진행바 + 보충출석 -->
        <section class="dm-att">
          <div class="dm-att-head">
            <h2 class="dm-att-title" id="attendance-month"></h2>
          </div>
          <div class="attend-cal-grid dm-cal" id="attendance-cal-grid"></div>
          <p class="dm-att-status" id="attendance-status"></p>
          <div class="dm-makeup-row">
            <button class="cd-btn cd-btn--brand cd-btn--auto-width" id="attendance-makeup-btn" onclick="attendanceMakeupClick()">
              <span id="attendance-makeup-label">보충출석</span>
              <span class="dm-makeup-count" id="attendance-makeup-count">3</span>
            </button>
          </div>
          <p class="dm-att-hint" id="dm-att-hint"></p>
        </section>
      </section>

    </main>
  </div>

  <!-- ── 모달: 이번 달 출석 25회 다 채웠을 때(보충출석 눌러도 더 안 오름) ── -->
  <div class="modal-overlay hidden" id="attendance-full-modal-overlay" onclick="closeAttendanceFullModal()">
    <div class="event-modal" onclick="event.stopPropagation()">
      <div class="event-modal-icon"><img src="image/confetti.png" alt=""></div>
      <h3 class="event-modal-title">이번 달 출석 완료!</h3>
      <p class="event-modal-message">이번 달 출석을 모두 채웠어요.<br>다음 달에 새로 시작해요!</p>
      <button class="event-modal-btn" onclick="closeAttendanceFullModal()">확인</button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="attendance.js"></script>
</body>
</html>
