<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 코드 이름 맞추기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="training-flow-page" id="chord-quiz-page">

  <!-- 페이지 커버: 초기화 완료 전 화면 가림 -->
  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 앱 로고탑바(데스크탑 전용) — injectAppChrome이 로고 주입하는 진짜 대상.
         main-content보다 먼저(DOM 앞) 와야 document.querySelector('.top-bar')가 이걸 먼저 잡음 ── -->
    <div class="top-bar desktop-topbar"></div>

    <!-- ── 메인 콘텐츠 ── -->
    <div class="main-content" id="main-content">

      <!-- ── 뒤로가기 + 퀴즈센터 + 피크바 ── -->
      <div class="top-bar">
        <button id="back-btn" class="icon-btn" onpointerup="handleBack()">
          <i data-lucide="x"></i>
        </button>
        <div id="quiz-topbar-center" class="quiz-topbar-center"></div>
        <div class="topbar-currency" id="topbar-currency" style="margin-left:auto;">
          <div class="currency-item currency-item--clickable" onclick="openPeakboxModal()">
            <span class="currency-count" id="currency-peakbox-count">0</span>
            <div class="currency-icon-box"><img src="image/gift.png" alt=""></div>
          </div>
          <div class="currency-item currency-item--clickable" onclick="openPeakTimerPopup(event)">
            <span class="currency-count" id="currency-peak-count">30/30</span>
            <div class="currency-icon-box"><img src="image/peak.svg" alt=""></div>
          </div>
        </div>
      </div>

      <!-- ── content-body: 실제 콘텐츠(뷰들) ── -->
      <div class="content-body">

      <!-- ── 레벨 선택 뷰 ── -->
      <div id="view-level-select" class="quiz-view">
        <div class="level-select-layout">
          <!-- 상단: 선택된 레벨 상세 패널 (JS로 채움) -->
          <div id="level-detail-panel" class="level-detail-panel"></div>
          <!-- 하단: 레벨 리스트 -->
          <div id="level-wheel-track" class="level-wheel-track"></div>
        </div>
      </div>

      <!-- ── 모드 선택 뷰 ── -->
      <div id="view-mode-select" class="quiz-view quiz-view--right">
        <div class="mode-select-scroll">
          <!-- 튜토리얼 캐러셀 -->
        <div class="mode-carousel">
          <div class="mode-carousel-track" id="mode-carousel-track">

            <div class="mode-carousel-card">
              <div class="mode-carousel-card-header">
                <i class="ph-fill ph-grid-nine"></i>
                <span class="mode-carousel-card-title">두 가지 모드로 훈련해요</span>
              </div>
              <ul class="mode-carousel-card-list">
                <li>코드 보고 이름 맞추기</li>
                <li>이름 보고 운지 맞추기</li>
              </ul>
            </div>

            <div class="mode-carousel-card">
              <div class="mode-carousel-card-header">
                <i data-lucide="timer"></i>
                <span class="mode-carousel-card-title">반응속도는 정답만 측정해요</span>
              </div>
              <p class="mode-carousel-card-desc">오답은 속도 통계에서 제외되며, 정답들의 평균 반응속도로 기록됩니다.</p>
            </div>

            <div class="mode-carousel-card">
              <div class="mode-carousel-card-header">
                <i data-lucide="trophy"></i>
                <span class="mode-carousel-card-title">최고기록 기준</span>
              </div>
              <p class="mode-carousel-card-desc">전문제 정답 달성 시에만 갱신돼요. 모든 문제를 맞히면서 가장 빠른 평균이 기록됩니다.</p>
            </div>

          </div>
          <div class="mode-carousel-dots" id="mode-carousel-dots">
            <div class="mode-carousel-dot mode-carousel-dot--active"></div>
            <div class="mode-carousel-dot"></div>
            <div class="mode-carousel-dot"></div>
          </div>
        </div>

        <div class="mode-cards">

            <div class="mode-card mode-card--active" data-mode="name-from-diagram" onpointerup="startQuiz('name-from-diagram')">
              <div class="mode-card-icon"><i class="ph ph-grid-nine"></i></div>
              <div class="mode-card-info">
                <span class="mode-card-title">코드 보고 이름 맞추기</span>
              </div>
            </div>

            <div class="mode-card mode-card--active" data-mode="diagram-from-name" onpointerup="startQuiz('diagram-from-name')">
              <div class="mode-card-icon mode-card-icon--text">Am</div>
              <div class="mode-card-info">
                <span class="mode-card-title">이름 보고 운지 맞추기</span>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- ── 퀴즈 뷰 ── -->
      <div id="view-quiz" class="quiz-view quiz-view--right">

        <!-- 카운트다운 — 데일리미션 .ms-precountdown과 완전히 동일한 구조(2026-08-31).
             문제뷰(#ms-quiz-view)는 이 동안 아예 안 보임(오버레이 아님, 화면 자체가 이거) -->
        <div id="quiz-precountdown" class="ms-precountdown" style="display:none">
          <div class="ms-precountdown-msgs">
            <p class="ms-precountdown-msg ms-stagger-pending" id="quiz-precountdown-msg1">최대한 빠르게 맞춰보세요!</p>
            <p class="ms-precountdown-msg ms-stagger-pending" id="quiz-precountdown-msg2">카운트가 시작됩니다.</p>
          </div>
          <div class="ms-countdown-num" id="quiz-countdown"></div>
        </div>

        <!-- 데일리미션 문제풀이 뷰(.ms-quiz-view)와 완전히 동일한 구조(2026-08-31) —
             #view-quiz가 #ms-main 역할까지 겸함(옛 .quiz-wrap/.quiz-inner 축소 레이어 제거) -->
        <div class="ms-quiz-view" id="ms-quiz-view">
          <div class="ms-quiz-question-card">
            <span id="quiz-timer-text" class="ms-quiz-timer">0.0s</span>
            <p id="quiz-feedback-msg" class="ms-quiz-feedback"></p>
            <div class="ms-quiz-canvas-wrap">
              <div id="quiz-canvas-slot" class="ms-quiz-canvas-slot">
                <canvas id="quiz-canvas"></canvas>
                <div id="quiz-loading" class="quiz-loading" style="display:none"><div class="quiz-loading-spinner"></div></div>
              </div>
              <span id="quiz-chord-name-display" class="ms-quiz-question-name" style="display:none"></span>
            </div>
          </div>
          <div id="quiz-choices" class="ms-quiz-choices"></div>
        </div>

      </div><!-- /view-quiz -->

      <!-- ── 결산 뷰 — 데일리미션 결산화면 구조 이식(2026-08-31). 총평 문구는 제외,
           게이지는 코드맞추기 1줄만, 최상단에 통계(정규분포+정답률/속도 문구) ── -->
      <div id="view-result" class="quiz-view quiz-view--right">
        <div class="ms-result">
          <div class="ms-result-scroll">
            <div class="ms-result-stat-card" id="result-stat-card">
              <div class="ms-result-stat-headline" id="result-stat-headline"></div>
              <div id="result-chart-wrap"></div>
              <p class="ms-result-stat-line" id="result-stat-line-count"></p>
              <p class="ms-result-stat-line" id="result-stat-line-speed"></p>
            </div>
            <div class="ms-result-scores">
              <div class="ms-result-score-row ms-result-score-row--blue">
                <span class="ms-result-score-name">코드맞추기</span>
                <div class="ms-result-gauge-row">
                  <div class="ms-result-gauge" id="result-gauge"></div>
                  <span class="ms-result-score-value" id="result-score-value"></span>
                </div>
              </div>
            </div>
            <ul class="ms-result-quiz-row" id="result-quiz-row"></ul>
          </div>
        </div>
        <div class="ms-bottom-actions ms-result-btn-row">
          <button class="cd-btn cd-btn--gray" onpointerup="closeResultModal()">그만하기</button>
          <button class="cd-btn cd-btn--blue" onpointerup="retryFromResult()">
            다시하기
            <span class="ldp-peak-cost" id="retry-peak-cost">
              <img src="image/white_peak.svg" alt="" class="ldp-peak-cost-icon">
              <span class="ldp-peak-cost-count" id="retry-peak-cost-count"></span>
            </span>
          </button>
        </div>
      </div><!-- /view-result -->

      </div><!-- /content-body -->

    </div>

  </div><!-- /app-shell -->

  <!-- ── 예습 모달 ── -->
  <div id="preview-modal-overlay" class="preview-modal-overlay">
    <div class="preview-modal">
      <div class="preview-modal-header">
        <span id="preview-modal-title" class="preview-modal-title"></span>
        <button class="icon-btn" onpointerup="closePreviewModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <!-- ── #/b 토글 (챌린지 모드 전용) ── -->
      <div id="preview-accidental-bar" class="preview-accidental-bar" style="display:none">
        <div class="accidental-toggle">
          <button class="acc-btn active" id="preview-acc-sharp"
                  onpointerup="setPreviewAccidental('sharp')">#</button>
          <button class="acc-btn" id="preview-acc-flat"
                  onpointerup="setPreviewAccidental('flat')">b</button>
        </div>
      </div>
      <div id="preview-modal-grid" class="preview-modal-grid"></div>
      <!-- 로딩 오버레이 (보이싱 다수 렌더 중 끊김 가림) -->
      <div id="preview-loading" class="preview-loading">
        <div class="preview-loading-spinner"></div>
      </div>
    </div>
  </div>

  <!-- ── 결과 모달 ── -->
  <div id="result-modal-overlay" class="result-modal-overlay">
    <div class="result-modal">
      <div class="result-modal-handle"></div>
      <div id="result-modal-score" class="result-modal-score">0 / 5</div>
      <div id="result-modal-avg" class="result-modal-avg"></div>
      <div id="result-items" class="result-items"></div>
      <div class="result-modal-actions">
        <button class="result-btn result-btn--back" onpointerup="closeResultModal()">뒤로가기</button>
        <button class="result-btn result-btn--retry" onpointerup="retryFromResult()">
          <span>다시하기</span>
          <span class="ldp-peak-cost" id="retry-peak-cost">
            <img src="image/white_peak.svg" alt="" class="ldp-peak-cost-icon">
            <span class="ldp-peak-cost-count" id="retry-peak-cost-count"></span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── 신기록 모달 ── -->
  <div id="newrecord-modal-overlay" class="newrecord-modal-overlay">
    <div class="newrecord-modal">
      <div class="newrecord-modal-icon"><i data-lucide="trophy"></i></div>
      <div class="newrecord-modal-title">신기록!</div>
      <div id="newrecord-modal-speed" class="newrecord-modal-speed"></div>
      <button class="newrecord-modal-btn" onpointerup="closeNewRecordModal()">확인</button>
    </div>
  </div>

  <!-- ── 차트 모달 ── -->
  <div id="chart-modal-overlay" class="chart-modal-overlay">
    <div class="chart-modal">
      <div class="chart-modal-handle"></div>
      <div class="chart-modal-header">
        <span id="chart-modal-title" class="chart-modal-title"></span>
        <button class="icon-btn" onpointerup="closeChartModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="chart-modal-body">
        <div class="chart-section">
          <span class="chart-section-label">평균 반응속도</span>
          <div id="chart-speed-wrap" class="chart-canvas-wrap">
            <canvas id="chart-speed"></canvas>
          </div>
        </div>
        <div class="chart-section">
          <span class="chart-section-label">누적 정답률</span>
          <div id="chart-accuracy-wrap" class="chart-canvas-wrap">
            <canvas id="chart-accuracy"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 튜토리얼 진행 레이어 (home.html과 동일 구조) ── -->
  <div id="tut-layer" class="hidden">
    <div id="tut-panel">
      <button id="tut-skip" onclick="Tutorial.confirmSkip()">건너뛰기</button>
      <h4 id="tut-title"></h4>
      <p id="tut-text"></p>
      <button id="tut-next" disabled onclick="Tutorial.next()">다음</button>
    </div>
  </div>

  <!-- 스와이프 유도 dot — 레이어 밖 body 직속. 어떤 요소에도 안 가리도록 최상위에 둔다 -->
  <div id="tut-scrollhint" hidden><div class="tut-swipe-dot"></div></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="mission-percentile.js"></script>
  <script src="chord-voicings.js"></script>
  <script src="chords-library.js"></script>
  <script src="voicing-canvas.js"></script>
  <script src="guitar-samples.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="guitar-audio.js"></script>
  <script src="tutorial-steps.js"></script>
  <script src="tutorial.js"></script>
  <script src="chord-name-quiz.js"></script>
</body>
</html>
