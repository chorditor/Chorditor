<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 튜너</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="training-flow-page">

  <!-- 페이지 커버: 초기화 완료 전 화면 가림 -->
  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 앱 로고탑바(데스크탑 전용) — injectAppChrome이 로고 주입하는 진짜 대상.
         main-content보다 먼저(DOM 앞) 와야 document.querySelector('.top-bar')가 이걸 먼저 잡음 ── -->
    <div class="top-bar app-logo-topbar top-bar--white"></div>

    <!-- ── 메인 콘텐츠 (와이어프레임) ── -->
    <div class="main-content" id="main-content">

      <!-- ── main-top-bar: 뒤로가기 전용 ── -->
      <div class="top-bar main-top-bar top-bar--white">
        <button id="back-btn" class="icon-btn" onpointerup="closeTunerPage()">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="tuner-wire-scroll">

        <!-- 1. 튜닝 프리셋 선택창 — 타이틀 역할도 겸함. 좌측에 프리셋 드롭다운 자리 -->
        <div class="wireframe-box" id="tuner-preset-area">
          <div id="tuner-preset-dropdown">
            <button type="button" id="tuner-preset-btn" onpointerup="toggleTunerPresetMenu(event)">
              <span id="tuner-preset-btn-label">스탠다드</span>
              <i data-lucide="chevron-down"></i>
            </button>
            <div id="tuner-preset-menu" class="hidden"></div>
          </div>
          <!-- 6번줄(저음)부터 1번줄 순서로 현재 프리셋의 음이름 나열 -->
          <div id="tuner-preset-notes">
            <span>E</span><span>A</span><span>D</span><span>G</span><span>B</span><span>E</span>
          </div>
        </div>

        <!-- 2. 튜너 주파수/음 표시 영역 — 상단: 실시간 피치 감지, 하단: 목표 음이름+주파수 -->
        <div class="wireframe-box wireframe-box--tall" id="tuner-freq-area">
          <div id="tuner-pitch-live">
            <!-- 게이지 상단: 현재 감지된 음이름 (정사각형). 무음 시 기본값 A2 -->
            <div id="tuner-pitch-current">A2</div>
            <!-- 튜닝 게이지 — 5센트 단위 눈금, 양끝 둥근 막대(pill). -50~+50은 또렷하게,
                 그 바깥 3개씩(-65~-55, +55~+65)은 점점 흐리게.
                 원기둥 투사(cos곡선)인데 반지름이 훨씬 크다고 가정 — 눈금 범위가 원의
                 꼭대기 근처 완만한 구간(0~60°)만 사용해서 전체적으로 훨씬 덜 굴곡짐(inline height) -->
            <div id="tuner-gauge">
              <div class="gauge-tick gauge-tick--fade3" data-cents="-65" style="height:28px"></div><!-- -65 -->
              <div class="gauge-tick gauge-tick--fade2" data-cents="-60" style="height:30px"></div><!-- -60 -->
              <div class="gauge-tick gauge-tick--fade1" data-cents="-55" style="height:32px"></div><!-- -55 -->
              <div class="gauge-tick gauge-tick--major" data-cents="-50" style="height:52px"><span class="gauge-tick-label">-50</span></div><!-- -50 -->
              <div class="gauge-tick" data-cents="-45" style="height:36px"></div><!-- -45 -->
              <div class="gauge-tick" data-cents="-40" style="height:38px"></div><!-- -40 -->
              <div class="gauge-tick" data-cents="-35" style="height:39px"></div><!-- -35 -->
              <div class="gauge-tick" data-cents="-30" style="height:40px"></div><!-- -30 -->
              <div class="gauge-tick gauge-tick--major" data-cents="-25" style="height:62px"><span class="gauge-tick-label">-25</span></div><!-- -25 -->
              <div class="gauge-tick" data-cents="-20" style="height:42px"></div><!-- -20 -->
              <div class="gauge-tick" data-cents="-15" style="height:43px"></div><!-- -15 -->
              <div class="gauge-tick" data-cents="-10" style="height:44px"></div><!-- -10 -->
              <div class="gauge-tick" data-cents="-5" style="height:44px"></div><!-- -5 -->
              <div class="gauge-tick gauge-tick--center" data-cents="0" style="height:96px"></div><!-- 0 -->
              <div class="gauge-tick" data-cents="5" style="height:44px"></div><!-- +5 -->
              <div class="gauge-tick" data-cents="10" style="height:44px"></div><!-- +10 -->
              <div class="gauge-tick" data-cents="15" style="height:43px"></div><!-- +15 -->
              <div class="gauge-tick" data-cents="20" style="height:42px"></div><!-- +20 -->
              <div class="gauge-tick gauge-tick--major" data-cents="25" style="height:62px"><span class="gauge-tick-label">+25</span></div><!-- +25 -->
              <div class="gauge-tick" data-cents="30" style="height:40px"></div><!-- +30 -->
              <div class="gauge-tick" data-cents="35" style="height:39px"></div><!-- +35 -->
              <div class="gauge-tick" data-cents="40" style="height:38px"></div><!-- +40 -->
              <div class="gauge-tick" data-cents="45" style="height:36px"></div><!-- +45 -->
              <div class="gauge-tick gauge-tick--major" data-cents="50" style="height:52px"><span class="gauge-tick-label">+50</span></div><!-- +50 -->
              <div class="gauge-tick gauge-tick--fade1" data-cents="55" style="height:32px"></div><!-- +55 -->
              <div class="gauge-tick gauge-tick--fade2" data-cents="60" style="height:30px"></div><!-- +60 -->
              <div class="gauge-tick gauge-tick--fade3" data-cents="65" style="height:28px"></div><!-- +65 -->
            </div>
            <!-- 게이지 하단: 음을 높여야/낮춰야 하는지 안내 -->
            <div id="tuner-pitch-direction">▲ 더 높여야 해요</div>
          </div>
          <!-- 마이크 상태/장치선택 영역. 초기엔 마이크 시작 트리거 겸용 -->
          <div id="tuner-tip" onpointerup="startMic()">탭해서 마이크 시작</div>
          <!-- 튜닝 팁 문구 — 몇초 간격으로 랜덤 순환 -->
          <div id="tuner-tuning-tip"></div>
          <div id="tuner-pitch-target">
            <div id="tuner-target-string">5번줄</div>
            <div id="tuner-target-note">A2</div>
            <div id="tuner-target-freq">110Hz</div>
          </div>
        </div>

        <!-- 3. 헤드스톡(페그+헤드) — 정확한 헤드 모양 레퍼런스 없어서 보류. 나중에 복원할 것.
        <div class="wireframe-box wireframe-box--fill" id="tuner-headstock-area">
          <div class="head-peg-col">
            <div class="head-peg">E</div>
            <div class="head-peg">A</div>
            <div class="head-peg">D</div>
          </div>
          <svg class="tuner-headstock" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet">
            <path d="M 50 2
                     C 68 2, 72 10, 78 16
                     L 92 30
                     C 97 35, 98 40, 98 48
                     L 98 60
                     C 98 68, 94 72, 88 76
                     L 60 100
                     C 56 104, 54 110, 54 120
                     L 46 120
                     C 46 110, 44 104, 40 100
                     L 12 76
                     C 6 72, 2 68, 2 60
                     L 2 48
                     C 2 40, 3 35, 8 30
                     L 22 16
                     C 28 10, 32 2, 50 2 Z" />
          </svg>
          <div class="head-peg-col">
            <div class="head-peg">G</div>
            <div class="head-peg">B</div>
            <div class="head-peg">E</div>
          </div>
        </div>
        -->

      </div><!-- /tuner-wire-scroll -->
    </div><!-- /main-content -->

  </div><!-- /app-shell -->

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="tuner.js"></script>
</body>
</html>
