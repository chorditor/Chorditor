<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <!-- ── 온보딩 오버레이 ── -->
  <div class="onboarding-overlay hidden" id="onboarding-overlay">
    <div class="onboarding-card">
      <div class="onboarding-logo">CHORDITOR</div>
      <p class="onboarding-desc">기타 코드표 제작 도구</p>
      <div class="onboarding-loading" id="onboarding-loading">
        <span class="onboarding-loading-dot"></span>
        <span class="onboarding-loading-dot"></span>
        <span class="onboarding-loading-dot"></span>
      </div>
      <div class="onboarding-signin-loading hidden" id="onboarding-signin-loading">
        <span class="onboarding-spinner"></span>
        <span class="onboarding-signin-loading-text">로그인 중...</span>
      </div>
      <button class="onboarding-start-btn hidden" id="onboarding-start-btn" onpointerdown="handleStart()">시작하기</button>
      <span class="onboarding-switch-account hidden" id="onboarding-switch-btn" onpointerdown="onboardingSwitchAccount()">다른 계정으로 변경</span>
      <button class="btn onboarding-btn hidden" id="onboarding-google-btn" onpointerdown="onboardingSignIn()">
        <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google 계정으로 계속하기
      </button>
    </div>
    <div class="onboarding-footer">
      <p>© 2026 LEE-HANSOL. All rights reserved.</p>
      <p>Chorditor · Guitar Chord Editor</p>
    </div>
  </div>

  <!-- ── DEV ONLY: 디자인 테스트용 온보딩 ── -->
  <div class="onboarding-overlay hidden" id="dev-onboarding-overlay">
    <div class="onboarding-card">
      <div class="onboarding-logo">CHORDITOR</div>
      <p class="onboarding-desc">기타 코드표 제작 도구</p>
      <button class="btn onboarding-btn" id="dev-onboarding-google-btn" onpointerdown="devOnboardingEnter()">
        <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google 계정으로 계속하기
      </button>
    </div>
    <div class="onboarding-footer">
      <p>© 2026 LEE-HANSOL. All rights reserved.</p>
      <p>Chorditor · Guitar Chord Editor</p>
    </div>
  </div>

  <!-- ── 강제 업데이트 오버레이 ── -->
  <div class="onboarding-overlay hidden" id="force-update-overlay">
    <div class="onboarding-card">
      <div class="onboarding-logo">CHORDITOR</div>
      <p class="onboarding-desc" style="margin-bottom:8px;">새로운 버전이 출시되었습니다.</p>
      <p class="onboarding-desc" style="font-size:13px;opacity:0.7;margin-bottom:24px;">계속 사용하려면 최신 버전으로 업데이트해 주세요.</p>
      <button class="onboarding-start-btn" onclick="openPlayStore()">업데이트 하기</button>
    </div>
  </div>

  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
