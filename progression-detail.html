<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorditor - 코드 진행 연습</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="training-flow-page">

  <div id="page-cover"></div>

  <div class="app-shell">

    <!-- ── 앱 로고탑바(데스크탑 전용) — injectAppChrome이 로고 주입하는 진짜 대상.
         main-content보다 먼저(DOM 앞) 와야 document.querySelector('.top-bar')가 이걸 먼저 잡음 ── -->
    <div class="top-bar top-bar--white app-logo-topbar"></div>

    <!-- 메인 콘텐츠 -->
    <div class="main-content progd-layout" id="main-content">

      <!-- ── main-top-bar: 뒤로가기 + 피크바 ── -->
      <div class="top-bar progd-top-bar top-bar--white main-top-bar">
        <button id="back-btn" onpointerup="requestBack()">
          <i data-lucide="chevron-left"></i>
        </button>
        <div class="topbar-currency" id="topbar-currency" style="margin-left:auto;margin-right:15px;">
          <div class="currency-item currency-item--clickable" onclick="openPeakboxModal()">
            <span class="currency-count" id="currency-peakbox-count">0</span>
            <div class="currency-icon-box"><img src="image/gift.png" alt=""></div>
          </div>
          <div class="currency-item currency-item--clickable" onclick="openPeakTimerPopup(event)">
            <span class="currency-count" id="currency-peak-count">30/30</span>
            <div class="currency-icon-box"><img src="image/peak.svg" alt=""></div>
          </div>
        </div>
      </div>

      <!-- ① 코드 뷰 -->
      <div class="progd-chord-view">
        <!-- 조성/모드 헤더 (root 선택 따라 전조) -->
        <div class="progd-key-header" id="detail-key-header">
          <span id="detail-key-header-text"></span>
        </div>
        <!-- 코드 진행 나열 -->
        <div class="progd-prog-bar" id="detail-prog-bar"></div>
        <!-- 메트로놈 인디케이터 -->
        <div class="progd-count-dots" id="detail-count-dots">
          <span class="progd-count-dot"></span>
          <span class="progd-count-dot"></span>
          <span class="progd-count-dot"></span>
          <span class="progd-count-dot"></span>
        </div>
      </div>
      <div class="progd-chord-view-inner" id="detail-chord-row"></div>

      <!-- ② BPM + 재생 -->
      <div class="progd-playbar">
        <div class="progd-bpm-row">
          <button class="progd-bpm-btn" onpointerup="changeBpm(-1)">−</button>
          <div class="progd-bpm-wheel-wrap">
            <div class="progd-bpm-wheel" id="detail-bpm-wheel"></div>
          </div>
          <button class="progd-bpm-btn" onpointerup="changeBpm(1)">+</button>
        </div>
        <div class="progd-play-wrap">
          <button class="progd-play-btn" id="detail-play-btn" onpointerup="togglePlay()" style="display:none">
            <i class="ph-fill ph-play"></i>
          </button>
          <button class="practice-gate-btn" id="detail-practice-gate" onpointerup="unlockPractice()">
            <span>연습 시작하기</span>
            <span class="practice-gate-cost">
              <img src="image/white_peak.svg" alt="" class="practice-gate-icon">
              <span>x2</span>
            </span>
          </button>
        </div>
      </div>

      <!-- ③ 키 선택 (하단) -->
      <div class="key-selector-section">
        <div class="progd-action-wrap">
          <div class="accidental-toggle-row">
            <div class="accidental-toggle" id="detail-accidental-toggle">
              <span class="acc-btn" id="detail-acc-sharp">#</span>
              <span class="acc-btn active" id="detail-acc-flat">b</span>
            </div>
            <button class="finger-toggle" id="detail-finger-toggle" aria-label="손가락 번호 표시">
              <i class="ph-bold ph-hand"></i>
            </button>
          </div>
        </div>
        <span class="key-selector-label">Root</span>
        <div class="key-selector" id="detail-key-strip"></div>
      </div>

    </div>

  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="analytics-sdk.js"></script>
  <script src="shared.js"></script>
  <script src="voicing-canvas.js"></script>
  <script src="chord-voicings.js"></script>
  <script src="chords-library.js"></script>
  <script src="guitar-samples.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="guitar-audio.js"></script>
  <script src="drum-audio.js"></script>
  <script src="drum-sets.js"></script>
  <script src="progression-data.js"></script>
  <script src="progression-parser.js"></script>
  <script src="progression-voicing-list.js"></script>
  <script src="progression-voicings.js"></script>
  <script src="progression-detail.js"></script>
</body>
</html>
